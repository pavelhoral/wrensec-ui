<form class="form" id="userQuery">
    <input type="hidden" name="queryFilter" data-validator="required" />

    <p>{{t 'common.user.userQuery.title'}}</p>

    <div id="filterContainer" class="filter-group filter-or">

        <label class="separator"><span>{{t 'common.user.userQuery.mainEnterPromptEmailAddress'}}</span></label>

        <div class="form-group">
            <label class="visually-hidden" for="input-mail">{{t 'common.user.emailAddress'}}</label>
            <input type="text" placeholder="{{t 'common.user.emailAddress'}}" id="input-mail" name="mail" class="form-control filter-value form-control-lg" />
        </div>

        <label class="separator"><span>{{t 'common.user.userQuery.orAllEnterPrompt'}}</span></label>

        <div class="filter-group filter-and">
            <div class="form-group">
                <label class="visually-hidden separator" for="input-givenName">
                    <span>{{t 'common.user.givenName'}}</span>
                </label>
                <input type="text" placeholder="{{t 'common.user.givenName'}}" id="input-givenName" name="givenName" class="form-control filter-value form-control-lg" />
            </div>

            <div class="form-group">
                <label class="visually-hidden separator" for="input-sn">
                    <span>{{t 'common.user.sn'}}</span>
                </label>
                <input type="text" placeholder="{{t 'common.user.sn'}}" id="input-sn" name="sn" class="form-control filter-value form-control-lg" />
            </div>
        </div>

    </div>

    <input type="submit" class="btn btn-lg btn-primary w-100 btn-uppercase" value="{{t 'common.form.submit'}}" />
</form>
