<div class="card">
    <div class="card-body kbaSet">
        <div class="form-group">
            <label class="visually-hidden" for="question_{{index}}">{{t 'common.user.kba.selectQuestion'}}</label>

            <select name="question_{{index}}" id="question_{{index}}" class="form-select form-select-lg"
                data-select-question data-validator="required">
                <option value="">{{t 'common.user.kba.selectQuestion'}}...</option>
                {{#each possibleQuestions}}
                    <option value="{{id}}" {{#equals id ../questionId}}selected{{/equals}}>{{mapTranslate question}}</option>
                {{/each}}
                <option value="customQuestion" {{#equals 'customQuestion' questionId}}selected{{/equals}}>{{t 'common.user.kba.provideYourOwn'}}:</option>
            </select>
        </div>

        {{#equals 'customQuestion' questionId}}
            <div class="form-group custom-question">
                <label class="visually-hidden separator" for="custom_question_{{index}}">
                    <span>{{t 'common.user.kba.customQuestion'}}</span>
                </label>
                <input type="text" placeholder="{{t 'common.user.kba.customQuestion'}}" id="custom_question_{{index}}"
                    name="custom_question_{{index}}" class="form-control form-control-lg" data-validator="required"
                    data-validator-event="keyup" data-custom-question value="{{customQuestion}}" />
            </div>
        {{/equals}}

        <div class="form-group">
            <label class="visually-hidden separator" for="answer_{{index}}">
                <span>{{t 'common.user.kba.answer'}}</span>
            </label>

            <input type="text" placeholder="{{t 'common.user.kba.answer'}}" id="answer_{{index}}"
                name="answer_{{index}}" class="form-control form-control-lg" data-validator="required" data-answer
                data-validator-event="keyup" value="{{answer}}" />
        </div>

        {{#if numberOfQuestionsSufficient}}
            <p class="text-start">
                <a href="#" role="button" data-delete-question><i class="fa fa-times"></i> {{t "common.form.delete"}}</a>
            </p>
        {{/if}}
    </div>
</div>
