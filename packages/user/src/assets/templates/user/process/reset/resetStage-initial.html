<form class="form">

    <div class="form-group">
        <label class="visually-hidden separator" for="input-password">
            <span>{{t 'common.user.password'}}</span>
        </label>
        <input type="password" placeholder="{{t 'common.user.password'}}" id="input-password" name="password" class="form-control form-control-lg"
            data-validation-dependents="input-confirmPassword" data-validator-event="keyup" data-validator="required" required />
        <span class="error form-control-feedback form-control-feedback-lg"><i class='fa validation-icon'></i></span>
    </div>

    <div class="form-group">
        <label class="visually-hidden separator" for="input-confirmPassword">
            <span>{{t 'common.user.confirmPassword'}}</span>
        </label>
        <input type="password" placeholder="{{t 'common.user.confirmPassword'}}" id="input-confirmPassword" class="form-control form-control-lg"
            data-validator="passwordConfirm" passwordField="input-password" data-validator-event="keyup" data-validator="required" required />
        <span class="error form-control-feedback form-control-feedback-lg"><i class='fa validation-icon'></i></span>
    </div>

    <input type="submit" class="btn btn-lg btn-primary w-100 btn-uppercase" value="{{t 'common.form.submit'}}" />
</form>
