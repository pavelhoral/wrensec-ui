{{#if urls}}
<ul class="dropdown-menu {{menuClass}}">
    {{#each urls}}
        {{#if divider}}
            <li><hr class="dropdown-divider"></li>
        {{else}}
            {{#if header}}
                <li><h6 class="dropdown-header">{{headerTitle}}</h6></li>
            {{else}}
                <li class="{{#if cssClass}}{{cssClass}}{{/if}}">
                    {{> navigation/_NavigationLink linkClass="dropdown-item"}}
                </li>
            {{/if}}
        {{/if}}
    {{/each}}
</ul>
{{/if}}
