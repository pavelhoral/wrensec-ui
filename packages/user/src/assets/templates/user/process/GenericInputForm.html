<form class="form">
    {{#requirements}}
    {{#each properties}}
    <div class="form-group">
        <label class="visually-hidden separator" for="input-{{@key}}">
            <span>{{this.description}}</span>
        </label>
        <input type="text" placeholder="{{this.description}}" id="input-{{@key}}" name="{{@key}}" class="form-control form-control-lg" />
    </div>
    {{/each}}
    {{/requirements}}
    <input type="submit" class="btn btn-lg btn-primary w-100 btn-uppercase" value="{{t 'common.form.submit'}}" />
</form>
