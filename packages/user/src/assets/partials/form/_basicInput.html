<div class="form-group row" data-form-group>
    <label class="col-md-3 col-form-label text-md-end" for="input-{{property}}">{{t label}}</label>
    <div class="col-md-6">
        <input
                id="input-{{property}}"
                class="form-control"
                type="{{#if type}}{{type}}{{else}}text{{/if}}"
                name="{{property}}"
                value="{{value}}"
        {{#if readonly}}readonly{{/if}}
        {{#if required}}required data-validator="required"{{/if}}
        {{#if extraAttributes}}{{{extraAttributes}}}{{/if}}
        />
        {{#unless noValidation}}
        <div role="status" class="validation-message"></div>
        <span class="form-control-feedback"><i class='fa validation-icon'></i></span>
        {{/unless}}
        {{#if helpKey}}
        <div class="form-text">{{t helpKey}}</div>
        {{/if}}
    </div>
</div>
